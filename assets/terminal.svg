<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 356" width="840" role="img" aria-label="Terminal: Yusuf Güç, backend developer. 3rd-year student at Muğla Sıtkı Koçman University, Muğla, Türkiye. Java, Spring Boot, Go, event-driven systems.">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <clipPath id="t1"><rect x="40" y="52" width="0" height="24"><animate attributeName="width" from="0" to="60" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="40" y="112" width="0" height="24"><animate attributeName="width" from="0" to="120" begin="1.9s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="40" y="234" width="0" height="24"><animate attributeName="width" from="0" to="80" begin="4.2s" dur="0.7s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .p { fill: #22c55e; }
    .c { fill: #e6edf3; }
    .k { fill: #38bdf8; }
    .v { fill: #c9d1d9; }
    .m { fill: #8b949e; }
    .a { fill: #f0b429; }
    .o { opacity: 0; }
  </style>

  <rect x="1" y="1" width="838" height="354" rx="12" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <path d="M2,38 H838" stroke="#21262d"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="420" y="25" text-anchor="middle" class="m" style="font-size:12px">yusuf@mugla — ~/profile</text>

  <!-- whoami -->
  <text x="24" y="70" class="p">$</text>
  <text x="40" y="70" class="c" clip-path="url(#t1)">whoami</text>
  <g class="o">
    <animate attributeName="opacity" to="1" begin="1.2s" dur="0.2s" fill="freeze"/>
    <text x="24" y="98" style="font-size:20px;font-weight:700" fill="#ffffff">Yusuf Güç</text>
    <text x="142" y="98" class="m">// backend developer</text>
  </g>

  <!-- cat about.yml -->
  <text x="24" y="130" class="p">$</text>
  <text x="40" y="130" class="c" clip-path="url(#t2)">cat about.yml</text>
  <g class="o">
    <animate attributeName="opacity" to="1" begin="3.0s" dur="0.15s" fill="freeze"/>
    <text x="24" y="154"><tspan class="k">university:</tspan><tspan class="v" x="128">Muğla Sıtkı Koçman University · 3rd year</tspan></text>
  </g>
  <g class="o">
    <animate attributeName="opacity" to="1" begin="3.2s" dur="0.15s" fill="freeze"/>
    <text x="24" y="176"><tspan class="k">location:</tspan><tspan class="v" x="128">Muğla, Türkiye</tspan></text>
  </g>
  <g class="o">
    <animate attributeName="opacity" to="1" begin="3.4s" dur="0.15s" fill="freeze"/>
    <text x="24" y="198"><tspan class="k">stack:</tspan><tspan class="v" x="128">Java · Spring Boot · Go · PostgreSQL · Redis · Kafka · Docker</tspan></text>
  </g>
  <g class="o">
    <animate attributeName="opacity" to="1" begin="3.6s" dur="0.15s" fill="freeze"/>
    <text x="24" y="220"><tspan class="k">focus:</tspan><tspan class="v" x="128">event-driven backends that survive real failures</tspan></text>
  </g>

  <!-- ./now.sh -->
  <text x="24" y="252" class="p">$</text>
  <text x="40" y="252" class="c" clip-path="url(#t3)">./now.sh</text>
  <g class="o">
    <animate attributeName="opacity" to="1" begin="5.1s" dur="0.15s" fill="freeze"/>
    <text x="24" y="276"><tspan class="a">▸</tspan><tspan class="v" x="44">learning Kafka and Redis in depth, one Docker lab at a time</tspan></text>
  </g>
  <g class="o">
    <animate attributeName="opacity" to="1" begin="5.3s" dur="0.15s" fill="freeze"/>
    <text x="24" y="298"><tspan class="a">▸</tspan><tspan class="v" x="44">building capstone APIs in Spring Boot and Go</tspan></text>
  </g>

  <g class="o">
    <animate attributeName="opacity" to="1" begin="5.8s" dur="0.1s" fill="freeze"/>
    <text x="24" y="332" class="p">$</text>
    <rect x="40" y="319" width="9" height="17" fill="#e6edf3">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="5.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
